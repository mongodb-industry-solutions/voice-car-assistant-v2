services:
  sync-server:
    image: objectboxio/sync-server-trial
    container_name: sync-server
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9980:9980"  # Admin UI
      - "9999:9999"  # Sync port for clients
    volumes:
      - .:/data
    working_dir: /data
    environment:
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASS=${MONGODB_PASS}
      - MONGODB_CLUSTER=${MONGODB_CLUSTER}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /sync-server \
          --model objectbox-model.json \
          --unsecured-no-authentication \
          --admin-bind 0.0.0.0:9980 \
          --log-level debug \
          --mongo-url "mongodb+srv://$${MONGODB_USER}:$${MONGODB_PASS}@$${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true" \
          --mongo-db "$${MONGODB_DATABASE}"

  search-service:
    build:
      context: ../search-service
      dockerfile: Dockerfile
    container_name: search-service
    restart: always
    ports:
      - "8080:8080"  # Search API
    volumes:
      - ./search-service-data:/app/search-service-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  conversation-service:
    build:
      context: ../conversation-service
      dockerfile: Dockerfile
    container_name: conversation-service
    restart: always
    ports:
      - "8081:8081"  # Conversation API
    volumes:
      - ./conversation-data:/app/conversation-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-service:
    build:
      context: ../telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    restart: always
    ports:
      - "8084:8084"  # Telemetry API
    volumes:
      - ./telemetry-data:/app/telemetry-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-simulator:
    build:
      context: ../telemetry-simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator
    restart: always
    ports:
      - "8082:8082"  # Simulator API
    depends_on:
      - telemetry-service
    environment:
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8084
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  telemetry-mcp-server:
    build:
      context: ../telemetry-mcp-server
      dockerfile: Dockerfile
    container_name: telemetry-mcp-server
    restart: always
    ports:
      - "3001:3001"  # MCP SSE endpoint
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - MCP_TRANSPORT=sse
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  navigation-service:
    build:
      context: ../navigation-service
      dockerfile: Dockerfile
    container_name: navigation-service
    restart: always
    ports:
      - "5001:5001"  # Navigation API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:4b
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb-search-service:
    build:
      context: ../mongodb-search-service
      dockerfile: Dockerfile
    container_name: mongodb-search-service
    restart: always
    ports:
      - "8085:8085"  # MongoDB Atlas Search API
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - VECTOR_INDEX_NAME=manual_chunks_vector_index
      - PORT=8085
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  langchain-agent-service:
    build:
      context: ../langchain-agent-service
      dockerfile: Dockerfile
    container_name: langchain-agent-service
    restart: always
    ports:
      - "5002:5002"  # Agent API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      search-service:
        condition: service_started
      mongodb-search-service:
        condition: service_started
      navigation-service:
        condition: service_started
      telemetry-mcp-server:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:4b
      - EMBEDDING_MODEL=voyageai/voyage-4-nano
      - SEARCH_SERVICE_URL=http://search-service:8080
      - MONGODB_SEARCH_SERVICE_URL=http://mongodb-search-service:8085
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - TELEMETRY_MCP_URL=http://telemetry-mcp-server:3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  voice-assistant-backend:
    build:
      context: ../voice-assistant-backend
      dockerfile: Dockerfile
    container_name: voice-assistant-backend
    restart: always
    ports:
      - "5000:5000"  # Web UI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      search-service:
        condition: service_started
      conversation-service:
        condition: service_started
      navigation-service:
        condition: service_started
      langchain-agent-service:
        condition: service_started
    environment:
      - SEARCH_SERVICE_URL=http://search-service:8080
      - CONVERSATION_SERVICE_URL=http://conversation-service:8081
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - AGENT_SERVICE_URL=http://langchain-agent-service:5002
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8084
      - OLLAMA_HOST=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  vss-telemetry-service:
    build:
      context: ../vss-telemetry-service
      dockerfile: Dockerfile
    container_name: vss-telemetry-service
    restart: always
    ports:
      - "8086:8086"
    volumes:
      - ./vss-telemetry-data:/app/vss-db
    depends_on:
      - sync-server
    environment:
      - SYNC_SERVER_URL=ws://sync-server:9999
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  vss-telemetry-simulator:
    build:
      context: ../vss-telemetry-simulator
      dockerfile: Dockerfile
    container_name: vss-telemetry-simulator
    restart: always
    ports:
      - "8087:8087"
    depends_on:
      - vss-telemetry-service
    environment:
      - VSS_TELEMETRY_SERVICE_URL=http://vss-telemetry-service:8086
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  vss-telemetry-mcp-server:
    build:
      context: ../vss-telemetry-mcp-server
      dockerfile: Dockerfile
    container_name: vss-telemetry-mcp-server
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - sync-server
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - MCP_TRANSPORT=sse
      - PORT=3002
      - VEHICLE_ID=VSS-DEMO-VIN-001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
