services:
  sync-server:
    image: objectboxio/sync-server-trial
    container_name: sync-server
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9980:9980"  # Admin UI
      - "9999:9999"  # Sync port for clients
    volumes:
      - .:/data
    working_dir: /data
    environment:
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASS=${MONGODB_PASS}
      - MONGODB_CLUSTER=${MONGODB_CLUSTER}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /sync-server \
          --model objectbox-model.json \
          --unsecured-no-authentication \
          --admin-bind 0.0.0.0:9980 \
          --log-level debug \
          --mongo-initial-import \
          --mongo-url "mongodb+srv://$${MONGODB_USER}:$${MONGODB_PASS}@$${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true" \
          --mongo-db "$${MONGODB_DATABASE}"

  # ── Toxiproxy — the offline/online lever ────────────────────────────────────────
  # The C++ sync clients connect to the Sync Server THROUGH this proxy (ws://toxiproxy:9998
  # → sync-server:9999). The 'sync' proxy is pre-created (and enabled) from toxiproxy.json at
  # startup, so it is listening on :9998 immediately — the clients connect on first try (no
  # startup race) and the backend only flips its `enabled` flag on pause/resume. -host 0.0.0.0
  # exposes the control API to the backend container (it binds localhost only by default).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    restart: always
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"  # control API
      - "9998:9998"  # proxied sync port (client entrypoint)
    depends_on:
      - sync-server

  # ── Ollama ────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Starts the server, then pulls qwen2.5:3b if not already cached in the volume.
    # The healthcheck waits until the model is listed before dependent services start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!
        echo "Waiting for Ollama server to be ready..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo "Pulling qwen2.5:3b (skipped if already cached)..."
        ollama pull qwen2.5:3b
        echo "Ollama ready."
        wait $$OLLAMA_PID
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen2.5"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # Uncomment to enable NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  search-service:
    build:
      context: ../search-service
      dockerfile: Dockerfile
    container_name: search-service
    restart: always
    ports:
      - "8080:8080"  # Search API
    volumes:
      - ./search-service-data:/app/search-service-db
    depends_on:
      - toxiproxy
    environment:
      - SYNC_SERVER_URL=ws://toxiproxy:9998
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  conversation-service:
    build:
      context: ../conversation-service
      dockerfile: Dockerfile
    container_name: conversation-service
    restart: always
    ports:
      - "8081:8081"  # Conversation API
    volumes:
      - ./conversation-data:/app/conversation-db
    depends_on:
      - toxiproxy
    environment:
      - SYNC_SERVER_URL=ws://toxiproxy:9998
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  navigation-service:
    build:
      context: ../navigation-service
      dockerfile: Dockerfile
    container_name: navigation-service
    restart: always
    ports:
      - "5001:5001"  # Navigation API
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongodb-search-service:
    build:
      context: ../mongodb-search-service
      dockerfile: Dockerfile
    container_name: mongodb-search-service
    restart: always
    ports:
      - "8085:8085"  # MongoDB Atlas Search API
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - VECTOR_INDEX_NAME=manual_chunks_vector_index
      - PORT=8085
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  langchain-agent-service:
    build:
      context: ../langchain-agent-service
      dockerfile: Dockerfile
    container_name: langchain-agent-service
    restart: always
    ports:
      - "5002:5002"  # Agent API
    depends_on:
      ollama:
        condition: service_healthy
      search-service:
        condition: service_started
      mongodb-search-service:
        condition: service_started
      navigation-service:
        condition: service_started
      vss-telemetry-api:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b
      - EMBEDDING_MODEL=voyageai/voyage-4-nano
      - SEARCH_SERVICE_URL=http://search-service:8080
      - MONGODB_SEARCH_SERVICE_URL=http://mongodb-search-service:8085
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - VSS_TELEMETRY_API_URL=http://vss-telemetry-api:3002
      - VSS_TELEMETRY_SERVICE_URL=http://vss-telemetry-service:8086
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # REST/SSE API + server-side STT (Whisper) / TTS (Piper). No UI, no WebSocket.
  voice-assistant-backend:
    build:
      context: ../voice-assistant-backend
      dockerfile: Dockerfile
    container_name: voice-assistant-backend
    restart: always
    ports:
      - "8000:8080"  # API (internal; exposed for debugging)
    depends_on:
      search-service:
        condition: service_started
      conversation-service:
        condition: service_started
      navigation-service:
        condition: service_started
      langchain-agent-service:
        condition: service_started
      toxiproxy:
        condition: service_started
    environment:
      - SEARCH_SERVICE_URL=http://search-service:8080
      - CONVERSATION_SERVICE_URL=http://conversation-service:8081
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - AGENT_SERVICE_URL=http://langchain-agent-service:5002
      - VSS_TELEMETRY_SERVICE_URL=http://vss-telemetry-service:8086
      - VSS_SIMULATOR_URL=http://vss-telemetry-simulator:8087
      - VSS_TELEMETRY_API_URL=http://vss-telemetry-api:3002
      # Local uses the shared toxiproxy pause (global). The 'sync' proxy is pre-created by
      # toxiproxy's config file, so the backend only flips its enabled flag on pause/resume
      # (staging/prod use SYNC_SCOPE=session instead).
      - SYNC_SCOPE=global
      - TOXIPROXY_URL=http://toxiproxy:8474
      - SYNC_PROXY_UPSTREAM=sync-server:9999
      - SYNC_PROXY_LISTEN=0.0.0.0:9998
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js cockpit UI — open http://localhost:5000. Talks to the backend only
  # through its own same-origin /api/* proxy routes (BACKEND_URL, server-side).
  voice-assistant-frontend:
    build:
      context: ../voice-assistant-frontend
      dockerfile: Dockerfile
    container_name: voice-assistant-frontend
    restart: always
    ports:
      - "5000:8080"  # Web UI
    depends_on:
      voice-assistant-backend:
        condition: service_started
    environment:
      - BACKEND_URL=http://voice-assistant-backend:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  vss-telemetry-service:
    build:
      context: ../vss-telemetry-service
      dockerfile: Dockerfile
    container_name: vss-telemetry-service
    restart: always
    ports:
      - "8086:8086"
    volumes:
      - ./vss-telemetry-data:/app/vss-db
    depends_on:
      - toxiproxy
    environment:
      - SYNC_SERVER_URL=ws://toxiproxy:9998
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  vss-telemetry-simulator:
    build:
      context: ../vss-telemetry-simulator
      dockerfile: Dockerfile
    container_name: vss-telemetry-simulator
    restart: always
    ports:
      - "8087:8087"
    depends_on:
      - vss-telemetry-service
    environment:
      - VSS_TELEMETRY_SERVICE_URL=http://vss-telemetry-service:8086
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  vss-telemetry-api:
    build:
      context: ../vss-telemetry-api
      dockerfile: Dockerfile
    container_name: vss-telemetry-api
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - sync-server
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - PORT=3002
      - VEHICLE_ID=VSS-DEMO-VIN-001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama-models:
    # Named volume — model weights persist across container restarts and rebuilds.
    # To force a re-pull: docker volume rm sync-server-setup_ollama-models
