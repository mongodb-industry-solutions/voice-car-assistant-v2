services:
  sync-server:
    image: objectboxio/sync-server-trial
    container_name: sync-server
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9980:9980"  # Admin UI
      - "9999:9999"  # Sync port for clients
    volumes:
      - .:/data
    working_dir: /data
    environment:
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASS=${MONGODB_PASS}
      - MONGODB_CLUSTER=${MONGODB_CLUSTER}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /sync-server \
          --model objectbox-model.json \
          --unsecured-no-authentication \
          --admin-bind 0.0.0.0:9980 \
          --log-level debug \
          --mongo-url "mongodb+srv://$${MONGODB_USER}:$${MONGODB_PASS}@$${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true" \
          --mongo-db "$${MONGODB_DATABASE}"

  search-service:
    build:
      context: ../search-service
      dockerfile: Dockerfile
    container_name: search-service
    restart: always
    ports:
      - "8080:8080"  # Search API
    volumes:
      - ./search-service-data:/app/search-service-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  conversation-service:
    build:
      context: ../conversation-service
      dockerfile: Dockerfile
    container_name: conversation-service
    restart: always
    ports:
      - "8081:8081"  # Conversation API
    volumes:
      - ./conversation-data:/app/conversation-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-service:
    build:
      context: ../telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    restart: always
    ports:
      - "8084:8084"  # Telemetry API
    volumes:
      - ./telemetry-data:/app/telemetry-db
    depends_on:
      - sync-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-simulator:
    build:
      context: ../telemetry-simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator
    restart: always
    ports:
      - "8082:8082"  # Simulator API
    depends_on:
      - telemetry-service
    environment:
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8084
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  telemetry-mcp-server:
    build:
      context: ../telemetry-mcp-server
      dockerfile: Dockerfile
    container_name: telemetry-mcp-server
    restart: always
    ports:
      - "3001:3001"  # MCP SSE endpoint
    environment:
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_CLUSTER}/?retryWrites=true&w=majority&tls=true
      - DATABASE_NAME=${MONGODB_DATABASE}
      - MCP_TRANSPORT=sse
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  navigation-service:
    build:
      context: ../navigation-service
      dockerfile: Dockerfile
    container_name: navigation-service
    restart: always
    ports:
      - "5001:5001"  # Navigation API
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=llama3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  langchain-agent-service:
    build:
      context: ../langchain-agent-service
      dockerfile: Dockerfile
    container_name: langchain-agent-service
    restart: always
    ports:
      - "5002:5002"  # Agent API
    depends_on:
      - search-service
      - navigation-service
      - telemetry-mcp-server
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=llama3.2
      - EMBEDDING_MODEL=nub235/voyage-4-nano
      - SEARCH_SERVICE_URL=http://search-service:8080
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - TELEMETRY_MCP_URL=http://telemetry-mcp-server:3001/sse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  voice-assistant-backend:
    build:
      context: ../voice-assistant-backend
      dockerfile: Dockerfile
    container_name: voice-assistant-backend
    restart: always
    ports:
      - "5000:5000"  # Web UI
    depends_on:
      - search-service
      - conversation-service
      - navigation-service
      - langchain-agent-service
    environment:
      - SEARCH_SERVICE_URL=http://search-service:8080
      - CONVERSATION_SERVICE_URL=http://conversation-service:8081
      - NAVIGATION_SERVICE_URL=http://navigation-service:5001
      - AGENT_SERVICE_URL=http://langchain-agent-service:5002
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3



