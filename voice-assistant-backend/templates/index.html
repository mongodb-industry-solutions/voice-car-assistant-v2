<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Manual Assistant | MongoDB + ObjectBox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <!-- Car Dashboard Container -->
    <div class="car-dashboard">
        <!-- Dashboard Decorations -->
        <div class="dashboard-left">
            <div class="gauge speedometer">
                <div class="gauge-label">MPH</div>
                <div class="gauge-value">0</div>
            </div>
            <div class="indicator">
                <span class="indicator-icon">🔋</span>
                <span class="indicator-text">100%</span>
            </div>
        </div>

        <!-- Center Touchscreen -->
        <div class="touchscreen">
            <!-- Touchscreen Header -->
            <div class="touchscreen-header">
                <div class="header-left">
                    <div class="mongodb-leaf">🍃</div>
                    <div class="header-title">
                        <h1>Car Assistant</h1>
                        <p class="header-subtitle">MongoDB + ObjectBox</p>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="stat-badge">
                        <span class="stat-icon">🔍</span>
                        <span class="stat-text" id="searchStatus">Connecting...</span>
                    </div>
                    <div class="stat-badge">
                        <span class="stat-icon">📚</span>
                        <span class="stat-text" id="chunkCount">--</span>
                    </div>
                </div>
            </div>

            <!-- Chat Messages Area -->
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- Welcome Message -->
                    <div class="message assistant-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <div class="message-text">
                                Welcome! I'm your car manual assistant. Click the microphone and ask me anything about your vehicle.
                            </div>
                            <div class="message-time">Just now</div>
                        </div>
                    </div>
                </div>

                <!-- Status Indicator -->
                <div class="chat-status" id="chatStatus">
                    <div class="status-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="status-text" id="statusText">Ready</span>
                </div>
            </div>

            <!-- Touchscreen Controls -->
            <div class="touchscreen-controls">
                <button class="mic-button" id="micButton" title="Click to start/stop">
                    <div class="mic-icon" id="micIcon">🎤</div>
                    <span class="mic-label">Tap to Talk</span>
                </button>
            </div>
        </div>

        <!-- Dashboard Decorations Right -->
        <div class="dashboard-right">
            <div class="gauge fuel-gauge">
                <div class="gauge-label">FUEL</div>
                <div class="gauge-value">⛽</div>
            </div>
            <div class="indicator">
                <span class="indicator-icon">🌡️</span>
                <span class="indicator-text">72°F</span>
            </div>
        </div>
    </div>

    <!-- Tech Stack Footer -->
    <div class="tech-footer">
        <span class="tech-badge">🎤 Whisper STT</span>
        <span class="tech-badge">🔍 ObjectBox HNSW</span>
        <span class="tech-badge">🤖 Ollama LLM</span>
        <span class="tech-badge">🗄️ MongoDB Atlas</span>
    </div>

    <script src="{{ url_for('static', filename='scripts/app.js') }}"></script>
</body>
</html>
